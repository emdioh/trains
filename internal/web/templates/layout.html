{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e4e4e0;
    --ok: #1f7a3d; --ok-bg: #e3f3e8; --late: #8a5a00; --late-bg: #fbf0d6; --bad: #b3261e; --bad-bg: #fbe3e1;
    --series: #2a78d6; --grid: #e1e0d9; --axis: #c3c2b7; --ink-muted: #898781;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --card: #1e1e21; --text: #ececee; --muted: #9a9aa2; --line: #2e2e33;
      --ok: #6fd08f; --ok-bg: #173323; --late: #f0c060; --late-bg: #3a2e12; --bad: #ff8a80; --bad-bg: #3d1a18;
      --series: #3987e5; --grid: #2c2c2a; --axis: #383835; --ink-muted: #898781;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  h1 { font-size: 1.4rem; margin: 0; }
  .muted { color: var(--muted); font-size: .875rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .name { font-weight: 600; }
  .delay { font-weight: 700; font-size: 1.1rem; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .ok { color: var(--ok); background: var(--ok-bg); }
  .late { color: var(--late); background: var(--late-bg); }
  .bad { color: var(--bad); background: var(--bad-bg); }
  .none { color: var(--muted); background: var(--bg); }
  .where { margin-top: 8px; }
  .problem { margin-top: 8px; padding: 8px 10px; border-radius: 8px; color: var(--late); background: var(--late-bg); font-size: .875rem; }
  .history { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .chip { font-size: .75rem; padding: 2px 8px; border-radius: 6px; font-variant-numeric: tabular-nums; }
  .empty { text-align: center; padding: 32px 16px; }
  code { font-size: .875rem; }
  a { color: inherit; }
  .edit { font: inherit; font-size: .875rem; color: var(--muted); text-decoration: none; margin-left: 8px;
    background: none; border: 0; padding: 0; cursor: pointer; }
  form.inline { display: inline; }
  .notice { margin: -8px 0 12px; }
  .footer { margin-top: 32px; text-align: center; }
  .edit:hover { color: var(--text); text-decoration: underline; }
  .button { display: inline-block; font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); text-decoration: none; cursor: pointer; }
  .button.small { padding: 4px 10px; font-size: .875rem; }
  .updated { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .button.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .button.danger { color: var(--bad); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  label.field { display: block; margin-bottom: 14px; }
  label.field > span { display: block; font-weight: 600; margin-bottom: 4px; }
  input[type=text], input[type=number], input[type=time] { font: inherit; width: 100%; max-width: 320px; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  .row input { width: auto; }
  .days { display: flex; flex-wrap: wrap; gap: 6px; }
  .days label { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .runs label { display: block; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; cursor: pointer; }
  fieldset { border: 0; padding: 0; margin: 0 0 14px; }
  legend { font-weight: 600; margin-bottom: 4px; padding: 0; }
  .error { padding: 8px 10px; border-radius: 8px; color: var(--bad); background: var(--bad-bg); margin-bottom: 14px; }
</style>
{{end}}
