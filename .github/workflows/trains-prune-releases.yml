name: trains prune releases

# One-off: deletes the trains releases older than v0.3.0, with their tags.
# Runs when this file is pushed; remove the file once it has run.
on:
  push:
    branches: [trains]
    paths: [.github/workflows/trains-prune-releases.yml]

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases before v0.3.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for v in 0.1.0 0.1.1 0.1.2 0.1.3 0.2.0 0.2.1 0.2.2 0.2.3 0.2.4 0.2.5; do
            tag="trains-v$v"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release delete "$tag" --cleanup-tag --yes
              echo "deleted $tag"
            else
              echo "no release $tag"
            fi
          done
          gh release list --limit 50
