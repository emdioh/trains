name: trains release

# Tags are prefixed with the project name because several projects share
# this repository: trains-v0.1.0 releases version v0.1.0 of trains.
on:
  push:
    tags: ["trains-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - run: make package VERSION="${GITHUB_REF_NAME#trains-}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "trains ${GITHUB_REF_NAME#trains-}" \
            --notes "Static Linux binaries of trains. Each tarball also holds deploy/ and config.example.yaml: unpack it on the server and run \`deploy/install.sh trains-linux-<arch>\` as root to install or update."
